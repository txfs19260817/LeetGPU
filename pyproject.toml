[project]
name = "leetgpu"
version = "0.1.0"
description = "CUDA, PyTorch, and Triton implementations for LeetGPU exercises"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.11.0",
  "triton>=3.6.0; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
